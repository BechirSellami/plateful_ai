<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateful AI</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --border: #e5e5e5;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --agent-bg: #f0f4ff;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --step-bg: #fef3c7;
    --step-text: #92400e;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --order-bg: #d1fae5;
    --order-text: #065f46;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-left h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-left .logo {
    font-size: 24px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .field-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field-group input {
    font-family: var(--font);
    font-size: 13px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 130px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-group input:focus { border-color: var(--primary); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #22c55e; }

  /* Chat area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .message.user { justify-content: flex-end; }
  .message.agent { justify-content: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    max-width: 85%;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .message.agent .bubble {
    background: var(--agent-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  /* Steps indicator */
  .steps-bar {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .step-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--step-bg);
    color: var(--step-text);
    display: flex;
    align-items: center;
    gap: 4px;
    animation: fadeIn 0.2s ease;
  }
  .step-chip .spinner {
    width: 10px; height: 10px;
    border: 2px solid var(--step-text);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  .step-chip.done { background: var(--primary-light); color: var(--primary); }
  .step-chip.done .spinner { display: none; }
  .step-chip.done::after { content: " \2713"; }

  /* Order card */
  .order-card {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: var(--order-bg);
    color: var(--order-text);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    animation: fadeIn 0.3s ease;
  }

  /* Error */
  .error-card {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: var(--error-bg);
    color: var(--error-text);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-size: 13px;
  }

  /* Intent badge */
  .intent-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    margin-bottom: 6px;
  }

  /* Input bar */
  .input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    flex-shrink: 0;
  }
  .input-bar form {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  .input-bar input[type="text"] {
    flex: 1;
    font-family: var(--font);
    font-size: 14px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 24px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-bar input[type="text"]:focus { border-color: var(--primary); }
  .input-bar button {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 24px;
    border: none;
    border-radius: 24px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .input-bar button:hover { opacity: 0.9; }
  .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Welcome */
  .welcome {
    max-width: 720px;
    width: 100%;
    margin: 60px auto 0;
    text-align: center;
    color: var(--text-muted);
  }
  .welcome h2 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.6; }
  .welcome .examples {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .welcome .examples button {
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .welcome .examples button:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">&#127869;</span>
    <h1>Plateful AI</h1>
  </div>
  <div class="header-right">
    <div class="field-group">
      <label>User</label>
      <input type="text" id="userId" value="emp_demo">
    </div>
    <div class="field-group">
      <label>Session</label>
      <input type="text" id="sessionId" value="sess_demo">
    </div>
    <div class="status-dot" id="statusDot" title="Disconnected"></div>
  </div>
</div>

<div class="chat-container" id="chat">
  <div class="welcome" id="welcome">
    <h2>Welcome to Plateful AI</h2>
    <p>Your personal catering assistant. Ask for recommendations, place orders, or tell me your preferences.</p>
    <div class="examples">
      <button onclick="sendExample(this)">I want pasta or a sandwich</button>
      <button onclick="sendExample(this)">Recommend something healthy under $16</button>
      <button onclick="sendExample(this)">I'm allergic to shellfish</button>
      <button onclick="sendExample(this)">Show me Thai food options</button>
    </div>
  </div>
</div>

<div class="input-bar">
  <form id="chatForm" onsubmit="return handleSubmit(event)">
    <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
const chatEl = document.getElementById("chat");
const welcomeEl = document.getElementById("welcome");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const statusDot = document.getElementById("statusDot");
const userIdInput = document.getElementById("userId");
const sessionIdInput = document.getElementById("sessionId");

let ws = null;
let currentStepsBar = null;
let processing = false;

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/chat`);

  ws.onopen = () => {
    statusDot.classList.add("connected");
    statusDot.title = "Connected";
  };

  ws.onclose = () => {
    statusDot.classList.remove("connected");
    statusDot.title = "Disconnected";
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "step") {
      handleStep(data);
    } else if (data.type === "result") {
      handleResult(data);
    } else if (data.type === "error") {
      handleError(data);
    }
  };
}

function handleStep(data) {
  if (!currentStepsBar) {
    currentStepsBar = document.createElement("div");
    currentStepsBar.className = "steps-bar";
    chatEl.appendChild(currentStepsBar);
  }

  // Mark previous chips as done
  currentStepsBar.querySelectorAll(".step-chip:not(.done)").forEach(chip => {
    chip.classList.add("done");
  });

  const chip = document.createElement("span");
  chip.className = "step-chip";
  chip.innerHTML = `<span class="spinner"></span> ${data.step}`;
  currentStepsBar.appendChild(chip);
  scrollToBottom();
}

function handleResult(data) {
  // Mark remaining steps as done
  if (currentStepsBar) {
    currentStepsBar.querySelectorAll(".step-chip:not(.done)").forEach(chip => {
      chip.classList.add("done");
    });
  }
  currentStepsBar = null;

  // Build response text
  let text = "";

  if (data.intent) {
    text += `<span class="intent-badge">${data.intent}</span>\n`;
  }

  if (data.recommendation_text) {
    text += data.recommendation_text;
  } else if (data.order) {
    // Order-only result (confirm_order without recommendation)
  } else if (data.intent === "declare_preference") {
    text += "Got it, I'll remember that for next time!";
  } else {
    text += "Done.";
  }

  if (text.trim()) {
    addMessage("agent", text);
  }

  // Order card
  if (data.order && data.order.status === "submitted") {
    const items = (data.order.items || []).map(i => i.name).join(", ");
    const total = data.order.total_usd ? `$${data.order.total_usd.toFixed(2)}` : "";
    const card = document.createElement("div");
    card.className = "order-card";
    card.textContent = `Order placed! #${data.order.order_id}: ${items} ${total}`;
    chatEl.appendChild(card);
  }

  processing = false;
  sendBtn.disabled = false;
  msgInput.focus();
  scrollToBottom();
}

function handleError(data) {
  if (currentStepsBar) {
    currentStepsBar.querySelectorAll(".step-chip:not(.done)").forEach(chip => {
      chip.classList.add("done");
    });
  }
  currentStepsBar = null;

  const card = document.createElement("div");
  card.className = "error-card";
  card.textContent = `Error: ${data.detail}`;
  chatEl.appendChild(card);

  processing = false;
  sendBtn.disabled = false;
  scrollToBottom();
}

function addMessage(role, content) {
  const wrapper = document.createElement("div");
  wrapper.className = `message ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (role === "agent") {
    bubble.innerHTML = formatMarkdown(content);
  } else {
    bubble.textContent = content;
  }
  wrapper.appendChild(bubble);
  chatEl.appendChild(wrapper);
  scrollToBottom();
}

function formatMarkdown(text) {
  // Simple markdown: bold, line breaks, intent badge passthrough
  return text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    chatEl.scrollTop = chatEl.scrollHeight;
  });
}

function handleSubmit(e) {
  e.preventDefault();
  const msg = msgInput.value.trim();
  if (!msg || processing || !ws || ws.readyState !== WebSocket.OPEN) return;

  // Hide welcome
  if (welcomeEl) welcomeEl.style.display = "none";

  processing = true;
  sendBtn.disabled = true;

  addMessage("user", msg);
  msgInput.value = "";

  ws.send(JSON.stringify({
    message: msg,
    user_id: userIdInput.value.trim() || "emp_demo",
    session_id: sessionIdInput.value.trim() || "sess_demo",
  }));
}

function sendExample(btn) {
  msgInput.value = btn.textContent;
  handleSubmit(new Event("submit"));
}

// Start connection
connect();
msgInput.focus();
</script>
</body>
</html>
