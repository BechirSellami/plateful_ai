services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plateful
      POSTGRES_PASSWORD: plateful
      POSTGRES_DB: plateful
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateful"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
